[package]
name = "cooper-gpui-prototype"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
gpui-kit = "=0.7.3"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[profile.dev]
debug = 0
incremental = false
